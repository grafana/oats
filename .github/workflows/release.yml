---
name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing release tag to publish or republish
        required: true

permissions: {}

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  goreleaser:
    # A status function allows manual runs when release-please is skipped,
    # while cancellation and failed automatic releases must not publish.
    if: >-
      ${{ !cancelled() && (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && needs.release-please.result == 'success' &&
         needs.release-please.outputs.release_created == 'true')
      ) }}
    needs: release-please
    runs-on: ubuntu-24.04
    env:
      # Artifact releases pair a focused tool allowlist with cache: false.
      MISE_ENABLE_TOOLS: go,goreleaser
      TAG_NAME: ${{ inputs.tag_name || needs.release-please.outputs.tag_name }}
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Verify workflow ref matches requested tag
        if: github.event_name == 'workflow_dispatch'
        env:
          WORKFLOW_REF: ${{ github.ref_name }}
          WORKFLOW_REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ -z "$TAG_NAME" ] || [ "$WORKFLOW_REF_TYPE" != "tag" ] || [ "$WORKFLOW_REF" != "$TAG_NAME" ]; then
            echo "workflow_dispatch must be run from tag '$TAG_NAME'" >&2
            echo "to produce attestations for the requested source revision" >&2
            exit 1
          fi
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: refs/tags/${{ env.TAG_NAME }}
          persist-credentials: false
      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: v2026.9.11
          sha256: 6e39ee1ffa926a1f64814efbf1d26c3f617255e2a6ba6152e3c8a5135fa5a35f
          cache: false
      - name: Run GoReleaser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: GCX_VERSION="$(bash scripts/gcx-version.sh)" goreleaser release --clean
      - name: Attest release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ./dist/checksums.txt
      - name: Publish signed Packslip manifest
        uses: jdx/packslip@74c75db7d611b36dd5a157999ec16cf823ccf80c # v1.2.0
        with:
          tag: ${{ env.TAG_NAME }}
          artifacts: dist/oats_*.tar.gz dist/oats_*.zip
          bin: oats
          attest: link
          resources: |
            cli-spec/usage=archive:share/oats/oats.usage.kdl
            skill/oats=archive:share/oats/skills/oats
      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$TAG_NAME" --draft=false
