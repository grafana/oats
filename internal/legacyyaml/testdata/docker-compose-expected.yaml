networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.16.57.0/24
services:
  grafana:
    image: grafana/grafana:13.2.1@sha256:f772d434e8fab0049deb2b1b30abd43342bcfca1537614aa8d36080232cf4283
    network_mode: host
    volumes:
      - ./configs/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/grafana-datasources.yaml
  mongodb:
    image: mongo:7-jammy@sha256:84c4a18b60a0e73d1577112b0a600b46cab477c64cfe0ff36d0647bbca055bd0
    logging:
      driver: json-file
      options:
        max-file: "2"
        max-size: 5m
    ports:
      - 27017:27017
    volumes:
      - dbdata6:/data/db
version: "3.9"
volumes:
  dbdata6: null
x-default-logging:
  driver: json-file
  options:
    max-file: "2"
    max-size: 5m
