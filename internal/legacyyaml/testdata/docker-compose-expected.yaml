networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.16.57.0/24
services:
  grafana:
    image: grafana/grafana:13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
    network_mode: host
    volumes:
      - ./configs/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/grafana-datasources.yaml
  mongodb:
    image: mongo:7-jammy@sha256:94aea1479556ad4e5aba7a31a6d53eb7b0ae76741950da45a13d5df5cddf1b3b
    logging:
      driver: json-file
      options:
        max-file: "2"
        max-size: 5m
    ports:
      - 27017:27017
    volumes:
      - dbdata6:/data/db
version: "3.9"
volumes:
  dbdata6: null
x-default-logging:
  driver: json-file
  options:
    max-file: "2"
    max-size: 5m
