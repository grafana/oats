[tools]

# Runtime used by the black-box examples.
"aqua:grafana/gcx" = "1.1.0"
go = "1.26.6"
goreleaser = "2.17.1"
k3d = "5.9.0"
kubectl = "1.36.3"
node = "24.19.0"

# Linters
actionlint = "1.7.12"
"aqua:grafana/flint" = "0.22.11"
"aqua:owenlamont/ryl" = "0.21.0"
biome = "2.5.9"
editorconfig-checker = "3.11.1"
golangci-lint = "2.13.1"
hadolint = "2.15.1"
lychee = "0.24.2"
# @yarnpkg/libzip 3.2.2 is npm-signed and matches Yarn's release commit, but
# was published without provenance; mise's no-downgrade policy otherwise rejects Renovate.
"npm:renovate" = { version = "44.37.1", trust_policy_excludes = ["@yarnpkg/libzip@3.2.2"] }
rumdl = "0.2.58"
shellcheck = "0.11.0"
shfmt = "3.13.1"
taplo = "0.10.0"
typos = "1.49.0"

[env]
FLINT_CONFIG_DIR = ".github/config"

[tasks.lint]
description = "Run all lints"
run = "flint run"

[tasks."lint:fix"]
description = "Auto-fix lint issues"
run = "flint run --fix"

[tasks.e2e-test]
description = "Run e2e cases"
run = "go test -v -buildvcs=false ./tests/e2e -run TestCases"

[tasks.check]
description = "Run all checks"
depends = ["lint", "test"]
