[tools]

# Runtime used by the black-box examples.
"aqua:grafana/gcx" = "1.7.1"
go = "1.27.3"
goreleaser = "2.19.0"
k3d = "5.9.0"
kubectl = "1.37.1"
node = "24.22.2"

# Linters
actionlint = "1.7.12"
"aqua:grafana/flint" = "0.22.15"
"aqua:owenlamont/ryl" = "0.26.0"
biome = "2.6.2"
editorconfig-checker = "4.0.2"
golangci-lint = "2.15.0"
hadolint = "2.15.1"
lychee = "0.24.2"
# @yarnpkg/libzip 3.2.2 is npm-signed and matches Yarn's release commit, but
# was published without provenance; mise's no-downgrade policy otherwise rejects Renovate.
"npm:renovate" = { version = "44.178.5", trust_policy_excludes = ["@yarnpkg/libzip@3.2.2"] }
rumdl = "v0.3.0"
shellcheck = "0.11.0"
shfmt = "3.14.1"
taplo = "0.10.0"
typos = "1.51.1"

[env]
FLINT_CONFIG_DIR = ".github/config"

[tasks.lint]
description = "Run all lints"
run = "flint run"

[tasks."lint:fix"]
description = "Auto-fix lint issues"
run = "flint run --fix"

[tasks.e2e-test]
description = "Run e2e cases"
run = "go test -v -buildvcs=false ./tests/e2e -run TestCases"

[tasks.check]
description = "Run all checks"
depends = ["lint", "test"]
